      <path d="m898 241 92-36m-79 43 92-36m-80 44 73-29m-60 36 47-19" stroke="#397989" stroke-width="1.6" opacity=".68"/>
      <path d="m796 183 162-64 147 49v11l-162 65-147-50z" fill="#d95d78"/>
      <path d="m943 232 162-64v11l-162 65z" fill="#bb4d76"/>
      <path d="m796 183 162-64 147 49-162 64z" fill="#ffa58f"/>
      <path d="m819 182 140-55 122 41-140 55z" fill="none" stroke="#9a4f6e" stroke-width="1.15"/>
      <path d="m848 179 54-21m-43 26 54-21m-43 26 39-15m56 13 73-29" stroke="#8d4d65" stroke-width="1.6" opacity=".65"/>
      <path d="m839 117 49-20 37 11 22-9 122 39v12l-123 49-107-35z" fill="#d69257"/>
      <path d="m946 186 123-48v12l-123 49z" fill="#c67454"/>
      <path d="m839 117 49-20 37 11 22-9 122 39-123 48-107-35z" fill="url(#paper)"/>
      <path d="m839 117 107 36 123-15m-123 15v33" fill="none" stroke="#bb8463" stroke-width="1.35"/>
      <path d="m839 117 107 36 123-15-123 48-107-35z" fill="#f3ba67" fill-opacity=".52" stroke="none"/>
