    </g>

    <g fill="none" stroke="#e5ecff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1046 124l34-46h88M1085 223l33-19h68M1105 315l23 28h67" stroke-opacity=".82"/>
      <circle cx="1046" cy="124" r="3" fill="#ffd578"/>
