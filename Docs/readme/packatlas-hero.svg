      <circle cx="1105" cy="315" r="3" fill="#ffa58f"/>
      <path d="M728 160v38m-4-32 4-6 4 6m-8 26 4 6 4-6M719 204v45m-4-39 4-6 4 6m-8 33 4 6 4-6" stroke-opacity=".65"/>
    </g>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.45" fill="#F3F3FF">
      <text x="1091" y="70">CONTAINER</text>
      <text x="1126" y="196">MEMBERS</text>
      <text x="1137" y="335">OUTPUT</text>
      <text x="707" y="381" fill="#c4d1ff">FIG. 01 / ARCHIVE CUTAWAY</text>
      <rect x="1041" y="370" width="166" height="27" rx="4" fill="#211f69" stroke="#9aabf2"/>
      <circle cx="1055" cy="383.5" r="3.5" fill="#ffd578"/>
      <text x="1067" y="388" fill="#ffebad">3.0.0 PREVIEW.1</text>
