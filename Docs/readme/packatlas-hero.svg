<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="title desc">
  <title id="title">PackAtlas — An illustrated archive workbench</title>
  <desc id="desc">An exploded archive on a cobalt drafting grid, with gold, coral and mint document layers.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#172d79"/>
      <stop offset=".53" stop-color="#263db3"/>
      <stop offset="1" stop-color="#603ed2"/>
    </linearGradient>
    <radialGradient id="glow" cx=".76" cy=".38" r=".61">
      <stop stop-color="#6774ff" stop-opacity=".86"/>
      <stop offset="1" stop-color="#6774ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff7d9"/>
      <stop offset="1" stop-color="#ffdf8b"/>
    </linearGradient>
    <pattern id="minorGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#E3EBFF" stroke-opacity=".14"/>
    </pattern>
    <pattern id="majorGrid" width="112" height="112" patternUnits="userSpaceOnUse">
      <path d="M112 0H0V112" fill="none" stroke="#D7E4FF" stroke-opacity=".25"/>
    </pattern>
    <pattern id="print" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".56" fill="#111c5d" opacity=".17"/>
    </pattern>
    <clipPath id="panel"><rect width="1280" height="448" rx="25"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1280" height="448" fill="url(#blue)"/>
    <rect width="1280" height="448" fill="url(#glow)"/>
    <rect width="1280" height="448" fill="url(#minorGrid)"/>
    <rect width="1280" height="448" fill="url(#majorGrid)"/>
    <rect width="1280" height="448" fill="url(#print)"/>

    <g fill="none" stroke="#DDE6FF">
      <rect x="23.5" y="23.5" width="1233" height="401" rx="11" stroke-opacity=".32"/>
      <path d="M23 41V23H41M1239 23H1257V41M1257 407V425H1239M41 425H23V407" stroke-opacity=".75" stroke-width="2"/>
      <path d="M64 344H602" stroke-opacity=".43"/>
      <path d="M734 107H1165M734 217H1211M695 324H1193M768 104V354M1099 80V359" stroke-opacity=".37" stroke-dasharray="4 7"/>
      <ellipse cx="960" cy="226" rx="230" ry="156" stroke-opacity=".24" transform="rotate(-16 960 226)"/>
      <ellipse cx="960" cy="226" rx="258" ry="175" stroke-opacity=".17" transform="rotate(-16 960 226)"/>
      <path d="M751 113h34m-17-17v34M1083 326h32m-16-16v32M1176 115h20m-10-10v20M750 346h20m-10-10v20" stroke-opacity=".61"/>
    </g>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" letter-spacing="2.5">
      <rect x="64" y="56" width="38" height="32" rx="5" fill="#ffd578"/>
      <path d="M74 65h17l4 5v9H74zM83 65v12m0-4h4m-4-4h-4" fill="none" stroke="#1f2a6f" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="115" y="77" fill="#FFE9AB" font-size="14">THE ARCHIVE WORKBENCH</text>
      <text x="64" y="382" fill="#FFF2D1" font-size="15">01 / BROWSE</text>
      <text x="245" y="382" fill="#FFF2D1" font-size="15">02 / TEST</text>
      <text x="404" y="382" fill="#FFF2D1" font-size="15">03 / EXTRACT</text>
      <circle cx="224" cy="376" r="2.5" fill="#ff9585"/>
      <circle cx="383" cy="376" r="2.5" fill="#ff9585"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="58" y="227" fill="#141c65" opacity=".63" font-size="109" font-weight="800" letter-spacing="-7">PackAtlas</text>
      <text x="58" y="220" fill="#fff8e8" font-size="109" font-weight="800" letter-spacing="-7">PackAtlas</text>
      <text x="65" y="276" fill="#EDF1FF" font-size="27" font-weight="500" letter-spacing="-.45">See what's inside before you unzip.</text>
      <text x="65" y="309" fill="#BBCBFF" font-size="17" letter-spacing=".15">A desktop workbench for archives. Fully offline.</text>
    </g>

